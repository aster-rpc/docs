name: Validate documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:docs
      - name: Publishing location
        run: echo 'The aster-rpc/website Publish SDK site to Cloudflare workflow builds and publishes both repositories. Scheduled revision checks pick up docs changes; run that workflow manually for immediate publishing.'
